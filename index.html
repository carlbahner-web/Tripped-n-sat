<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tripped 'n Sat — Loop Station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="start-overlay">
  <button id="start-btn">[ Start Session ]</button>
  <p>The band sits idle until you bring someone in. Tap a player to add their part, tap again to drop it — the loop never restarts, so any combination stays locked together.</p>
  <p class="silent-note">Heads up: if you can’t hear anything, check your ringer&nbsp;/ silent switch.</p>
</div>

<header class="brand">
  <h1>Tripped N Sat</h1>
  <p class="brand-sub">Loop Station</p>
</header>

<main class="stage">
  <div class="video-row">
    <div class="channel" data-channel="drums">
      <button class="screen" type="button" data-index="0" aria-pressed="false" aria-label="Drums">
      <video class="loop-video off-video" data-index="0" muted loop playsinline>
        <source src="media/drums-off.webm" type="video/webm">
        <source src="media/drums-off.mp4" type="video/mp4">
      </video>
      <video class="loop-video on-video" preload="auto" data-index="0" muted loop playsinline>
        <source src="media/drums-on.webm" type="video/webm">
        <source src="media/drums-on.mp4" type="video/mp4">
      </video>
    </button>
      <input class="volume" type="range" min="0" max="1" step="0.01" value="1"
             data-index="0" aria-label="Drums volume">
    </div>
    <div class="channel" data-channel="guitars">
      <button class="screen" type="button" data-index="1" aria-pressed="false" aria-label="Guitars">
      <video class="loop-video off-video" data-index="1" muted loop playsinline>
        <source src="media/guitars-off.webm" type="video/webm">
        <source src="media/guitars-off.mp4" type="video/mp4">
      </video>
      <video class="loop-video on-video" preload="auto" data-index="1" muted loop playsinline>
        <source src="media/guitars-on.webm" type="video/webm">
        <source src="media/guitars-on.mp4" type="video/mp4">
      </video>
    </button>
      <input class="volume" type="range" min="0" max="1" step="0.01" value="1"
             data-index="1" aria-label="Guitars volume">
    </div>
    <div class="channel" data-channel="bass">
      <button class="screen" type="button" data-index="2" aria-pressed="false" aria-label="Bass">
      <video class="loop-video off-video" data-index="2" muted loop playsinline>
        <source src="media/bass-off.webm" type="video/webm">
        <source src="media/bass-off.mp4" type="video/mp4">
      </video>
      <video class="loop-video on-video" preload="auto" data-index="2" muted loop playsinline>
        <source src="media/bass-on.webm" type="video/webm">
        <source src="media/bass-on.mp4" type="video/mp4">
      </video>
    </button>
      <input class="volume" type="range" min="0" max="1" step="0.01" value="1"
             data-index="2" aria-label="Bass volume">
    </div>
    <div class="channel" data-channel="synths">
      <button class="screen" type="button" data-index="3" aria-pressed="false" aria-label="Synths">
      <video class="loop-video off-video" data-index="3" muted loop playsinline>
        <source src="media/synths-off.webm" type="video/webm">
        <source src="media/synths-off.mp4" type="video/mp4">
      </video>
      <video class="loop-video on-video" preload="auto" data-index="3" muted loop playsinline>
        <source src="media/synths-on.webm" type="video/webm">
        <source src="media/synths-on.mp4" type="video/mp4">
      </video>
    </button>
      <input class="volume" type="range" min="0" max="1" step="0.01" value="1"
             data-index="3" aria-label="Synths volume">
    </div>
  </div>

  <audio class="loop-audio" data-index="0" src="media/drums.mp3"></audio>
  <audio class="loop-audio" data-index="1" src="media/guitars.mp3"></audio>
  <audio class="loop-audio" data-index="2" src="media/bass.mp3"></audio>
  <audio class="loop-audio" data-index="3" src="media/synths.mp3"></audio>
</main>

<img id="jumpscare-cat" src="media/candidates/cat-icon.gif" alt="" aria-hidden="true">

<script src="app.js"></script>
</body>
</html>
